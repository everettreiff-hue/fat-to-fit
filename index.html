<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="4; url=https://e-health-tracker.web.app/">
<title>Health Tracker has moved</title>
<style>
  :root { --bg: #F4F5FA; --card: #FFFFFF; --ink: #141A2E; --muted: #586178; --accent: #6B3FE0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0A0C0F; --card: #15181E; --ink: #F3F5F8; --muted: #A1A9B6; --accent: #8F6BFF; } }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box;
         background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 380px; background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); font-size: 15px; line-height: 1.5; margin: 0 0 20px; }
  a.btn { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 14px; }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Health Tracker has moved</h1>
  <p>The app now lives at a new address. Sign in once there, then add it to your Home Screen again.</p>
  <a class="btn" href="https://e-health-tracker.web.app/">Open the new address</a>
  <small>e-health-tracker.web.app · forwarding automatically…</small>
</main>
</body>
</html>
